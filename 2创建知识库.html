<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建知识库 · 模态框</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #eef2f6;
            min-height: 100vh;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 模拟页面背景 */
        .page {
            width: 1000px;
            max-width: 100%;
            background: white;
            border-radius: 48px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .page-header h2 {
            font-size: 2rem;
            color: #0a253b;
        }
        .open-modal-btn {
            background: #1f5090;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 16px -6px #1f5090cc;
            border: 1px solid #154079;
        }

        /* ---------- 模态框样式 ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-container {
            background: white;
            width: 560px;
            max-width: 90%;
            border-radius: 48px;
            box-shadow: 0 40px 70px -20px rgba(0,20,40,0.5);
            padding: 32px 32px 36px;
            transform: scale(0.95);
            transition: 0.2s;
        }
        .modal-overlay.active .modal-container {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .modal-header h3 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b2942;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-header h3 i {
            color: #1f5090;
            background: #eaf1fc;
            padding: 12px;
            border-radius: 20px;
        }
        .close-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #8fa3c0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            background: #f0f4fc;
            color: #1f5090;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 24px;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #25476b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-control {
            width: 100%;
            padding: 16px 20px;
            background: #f9fcff;
            border: 1px solid #dae2ed;
            border-radius: 30px;
            font-size: 1rem;
            transition: 0.1s;
        }
        .form-control:focus {
            border-color: #1f5090;
            outline: none;
            box-shadow: 0 0 0 3px rgba(31,80,144,0.15);
            background: white;
        }
        .radio-group {
            display: flex;
            gap: 30px;
            background: #f3f8ff;
            padding: 12px 20px;
            border-radius: 40px;
            border: 1px solid #d0deef;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1f5090;
        }
        .dept-selector {
            background: #f3f8ff;
            border-radius: 40px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px dashed #9eb9db;
            cursor: pointer;
            color: #1f5090;
            font-weight: 500;
        }
        .dept-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 12px 0 8px;
        }
        .dept-tag {
            background: #e5effa;
            color: #1f5090;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #b2cbeb;
        }
        .dept-tag i {
            cursor: pointer;
            opacity: 0.6;
        }
        .dept-tag i:hover {
            opacity: 1;
        }
        .hint-text {
            font-size: 0.8rem;
            color: #6f88a8;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 36px;
        }
        .btn-primary {
            background: #1f5090;
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 16px -6px #1f5090cc;
        }
        .btn-secondary {
            background: white;
            border: 1px solid #c0d0e8;
            color: #1a3455;
            font-weight: 500;
            padding: 15px 32px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            background: #123f6e;
        }
        .btn-secondary:hover {
            background: #f5f9ff;
            border-color: #8fa9cc;
        }

        /* 部门面板 (模拟) */
        .dept-panel {
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.2);
            margin-top: 10px;
            border: 1px solid #dae2ed;
            display: none;
        }
        .dept-panel.show {
            display: block;
        }
        .dept-tree {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .dept-tree li {
            padding: 10px 0 10px 20px;
            border-bottom: 1px solid #eaf1fb;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="page-header">
            <h2>知识库管理</h2>
            <button class="open-modal-btn" id="openCreateModalBtn"><i class="fas fa-plus-circle"></i> 新建知识库</button>
        </div>
        <div style="background: #f9fcff; border-radius: 40px; padding: 40px; text-align: center; color: #8fa3c0;">
            <i class="fas fa-database fa-3x" style="opacity: 0.3;"></i>
            <p style="margin-top: 20px;">点击“新建知识库”打开创建模态框</p>
        </div>
    </div>

    <!-- 创建知识库模态框 -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle"></i> 创建知识库</h3>
                <button class="close-btn" id="closeModalBtn"><i class="fas fa-times"></i></button>
            </div>

            <!-- 表单 -->
            <div class="form-group">
                <div class="form-label"><i class="fas fa-tag"></i> 知识库名称 <span style="color:#b13e3e;">*</span></div>
                <input type="text" class="form-control" placeholder="例如：产品研发知识库" id="kbName" value="新产品知识库">
            </div>

            <div class="form-group">
                <div class="form-label"><i class="fas fa-align-left"></i> 简介</div>
                <input type="text" class="form-control" placeholder="选填，描述知识库的用途" id="kbDesc" value="用于存放团队文档和规范">
            </div>

            <div class="form-group">
                <div class="form-label"><i class="fas fa-sitemap"></i> 知识库类型</div>
                <div class="radio-group" id="typeRadioGroup">
                    <label class="radio-item">
                        <input type="radio" name="kbType" value="personal" checked> <i class="fas fa-user"></i> 个人知识库
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="kbType" value="company"> <i class="fas fa-building"></i> 公司级知识库
                    </label>
                </div>
            </div>

            <!-- 公司级才显示的关联部门区块 -->
            <div class="form-group" id="deptSection" style="display: none;">
                <div class="form-label"><i class="fas fa-building"></i> 关联部门</div>
                <!-- 已选部门标签 -->
                <div class="dept-tags" id="deptTags">
                    <span class="dept-tag">产品部 <i class="fas fa-times-circle" data-dept="产品部"></i></span>
                    <span class="dept-tag">设计部 <i class="fas fa-times-circle" data-dept="设计部"></i></span>
                </div>
                <!-- 添加部门按钮 (模拟) -->
                <div class="dept-selector" id="addDeptBtn">
                    <i class="fas fa-plus-circle"></i> 添加部门
                </div>
                <!-- 模拟部门面板 (点击添加后出现) -->
                <div class="dept-panel" id="deptPanel">
                    <ul class="dept-tree">
                        <li><i class="fas fa-folder"></i> 产研部 <button style="margin-left:auto;" class="add-dept-demo" data-dept="产研部">添加</button></li>
                        <li><i class="fas fa-folder"></i> 市场部 <button style="margin-left:auto;" class="add-dept-demo" data-dept="市场部">添加</button></li>
                        <li><i class="fas fa-folder"></i> 运营部 <button style="margin-left:auto;" class="add-dept-demo" data-dept="运营部">添加</button></li>
                    </ul>
                </div>
                <div class="hint-text"><i class="fas fa-info-circle"></i> 创建后，部门成员自动同步，整进整出</div>
            </div>

            <div class="form-actions">
                <button class="btn-secondary" id="cancelModalBtn"><i class="fas fa-times"></i> 取消</button>
                <button class="btn-primary" id="submitCreateBtn"><i class="fas fa-check"></i> 创建知识库</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const modal = document.getElementById('createModal');
            const openBtn = document.getElementById('openCreateModalBtn');
            const closeBtn = document.getElementById('closeModalBtn');
            const cancelBtn = document.getElementById('cancelModalBtn');
            const typeRadios = document.querySelectorAll('input[name="kbType"]');
            const deptSection = document.getElementById('deptSection');
            const deptTags = document.getElementById('deptTags');
            const addDeptBtn = document.getElementById('addDeptBtn');
            const deptPanel = document.getElementById('deptPanel');
            const submitBtn = document.getElementById('submitCreateBtn');

            // 打开模态框
            openBtn.addEventListener('click', () => {
                modal.classList.add('active');
                // 重置为个人知识库（默认）
                document.querySelector('input[value="personal"]').checked = true;
                deptSection.style.display = 'none';
                // 重置部门标签
                deptTags.innerHTML = `
                    <span class="dept-tag">产品部 <i class="fas fa-times-circle" data-dept="产品部"></i></span>
                    <span class="dept-tag">设计部 <i class="fas fa-times-circle" data-dept="设计部"></i></span>
                `;
            });

            // 关闭模态框
            const closeModal = () => {
                modal.classList.remove('active');
                deptPanel.classList.remove('show');
            };
            closeBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);

            // 点击遮罩关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // 类型切换：公司级显示部门区块
            typeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'company') {
                        deptSection.style.display = 'block';
                    } else {
                        deptSection.style.display = 'none';
                        deptPanel.classList.remove('show');
                    }
                });
            });

            // 添加部门按钮：显示模拟部门面板
            addDeptBtn.addEventListener('click', () => {
                deptPanel.classList.toggle('show');
            });

            // 模拟从部门面板添加部门
            document.querySelectorAll('.add-dept-demo').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dept = btn.dataset.dept;
                    // 检查是否已存在
                    const exists = Array.from(deptTags.querySelectorAll('.dept-tag')).some(tag => tag.innerText.includes(dept));
                    if (!exists) {
                        const newTag = document.createElement('span');
                        newTag.className = 'dept-tag';
                        newTag.innerHTML = `${dept} <i class="fas fa-times-circle" data-dept="${dept}"></i>`;
                        deptTags.appendChild(newTag);
                        // 给新tag的删除按钮加事件
                        newTag.querySelector('i').addEventListener('click', function() {
                            this.closest('.dept-tag').remove();
                        });
                    }
                    deptPanel.classList.remove('show');
                });
            });

            // 部门标签删除功能 (通过事件委托)
            deptTags.addEventListener('click', (e) => {
                if (e.target.classList.contains('fa-times-circle')) {
                    e.target.closest('.dept-tag').remove();
                }
            });

            // 提交创建 (演示)
            submitBtn.addEventListener('click', () => {
                const name = document.getElementById('kbName').value.trim();
                if (!name) {
                    alert('知识库名称不能为空');
                    return;
                }
                const type = document.querySelector('input[name="kbType"]:checked').value;
                const desc = document.getElementById('kbDesc').value || '无简介';
                let depts = [];
                if (type === 'company') {
                    depts = Array.from(deptTags.querySelectorAll('.dept-tag')).map(tag => tag.innerText.trim().replace('×', '').trim());
                }
                
                // 模拟创建成功
                alert(`✅ 知识库创建成功！\n名称：${name}\n类型：${type === 'personal' ? '个人' : '公司级'}\n简介：${desc}${type === 'company' ? '\n关联部门：' + depts.join(', ') : ''}`);
                closeModal();
            });

            // 阻止面板内点击冒泡
            deptPanel.addEventListener('click', (e) => e.stopPropagation());
        })();
    </script>
</body>
</html>
