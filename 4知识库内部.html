<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 · 权限精简版</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #e9f0f7;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .knowledge-base {
            width: 100vw;
            height: 100vh;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* 顶部导航 */
        .top-nav {
            padding: 18px 28px;
            background: #ffffffcc;
            border-bottom: 1px solid #e0eaf5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(4px);
        }
        .nav-left h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b2942;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-left h1 i {
            color: #1f5090;
            background: #e1ebf9;
            padding: 10px;
            border-radius: 20px;
        }
        .nav-right {
            display: flex;
            gap: 20px;
            color: #3f5f83;
        }
        .nav-right span {
            background: #ecf3fc;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧目录树 */
        .dir-tree {
            width: 320px;
            background: #f8fbfe;
            border-right: 1px solid #dbe4f0;
            padding: 20px 16px 20px 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .tree-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-right: 8px;
        }
        .tree-header h3 {
            font-size: 1.2rem;
            color: #1a3455;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tree-actions {
            display: flex;
            gap: 8px;
        }
        .tree-actions button {
            background: white;
            border: 1px solid #cdddec;
            border-radius: 30px;
            width: 34px;
            height: 34px;
            color: #1f5090;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .tree-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }
        .tree-node {
            list-style: none;
            margin: 2px 0;
        }
        .node-content {
            display: flex;
            align-items: center;
            padding: 8px 8px 8px 0;
            border-radius: 30px;
            cursor: pointer;
            color: #2f405c;
            font-size: 0.95rem;
        }
        .node-content:hover {
            background: #e3ecf9;
        }
        .node-content i:first-child {
            width: 28px;
            color: #6f8db0;
        }
        .node-content .name {
            flex: 1;
            margin-left: 4px;
            font-weight: 500;
        }
        .dir-ops {
            display: flex;
            gap: 6px;
            margin-right: 4px;
            opacity: 0.3;
        }
        .node-content:hover .dir-ops {
            opacity: 1;
        }
        .dir-ops button {
            background: transparent;
            border: none;
            color: #4f6f97;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 20px;
        }
        .dir-ops button:hover {
            background: white;
            color: #1f5090;
        }
        .children {
            padding-left: 24px;
        }

        /* 右侧面板 */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: white;
        }

        /* 筛选栏 */
        .filter-bar {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2eaf5;
            background: #ffffff;
        }
        .filter-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .status-tabs {
            display: flex;
            gap: 6px;
            background: #f3f8ff;
            padding: 4px;
            border-radius: 40px;
            border: 1px solid #dae3f0;
        }
        .status-tab {
            background: transparent;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            color: #4f688b;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .status-tab.active {
            background: white;
            color: #1f5090;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .file-status-tabs {
            display: flex;
            gap: 6px;
            background: #f3f8ff;
            padding: 4px;
            border-radius: 40px;
            border: 1px solid #dae3f0;
            margin-left: 5px;
        }
        .file-status-tab {
            background: transparent;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            color: #4f688b;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .file-status-tab.active {
            background: white;
            color: #1f5090;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .role-filter {
            background: #f3f8ff;
            border-radius: 40px;
            padding: 5px 16px;
            border: 1px solid #d0deef;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .role-filter select {
            border: none;
            background: transparent;
            font-weight: 500;
            color: #1f5090;
            outline: none;
            font-size: 0.9rem;
        }
        .upload-btn {
            background: #1f5090;
            border: none;
            color: white;
            padding: 10px 26px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 12px -6px #1f5090b3;
        }
        .qa-btn {
            background: #2d5e6b;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .date-range {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f3f8ff;
            padding: 5px 15px;
            border-radius: 40px;
            border: 1px solid #cfdff2;
        }
        .date-input {
            border: none;
            background: transparent;
            padding: 8px 0;
            width: 110px;
            font-size: 0.9rem;
            color: #1a2e4a;
            outline: none;
        }
        .date-input::placeholder {
            color: #8fa3c0;
        }
        .date-separator {
            color: #6f89aa;
            font-weight: 500;
        }
        .search-box {
            background: #f3f8ff;
            border: 1px solid #cfdff2;
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 240px;
        }
        .search-box input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 0.95rem;
        }

        /* 文件列表 */
        .file-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 28px 24px;
        }
        .file-table {
            width: 100%;
            border-collapse: collapse;
        }
        .file-table th {
            text-align: left;
            padding: 16px 8px 12px 8px;
            color: #5c7492;
            font-weight: 500;
            font-size: 0.85rem;
            border-bottom: 1px solid #dee9f5;
        }
        .file-table td {
            padding: 16px 8px;
            border-bottom: 1px solid #edf3fa;
            color: #1b314c;
            vertical-align: middle;
        }
        .file-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #f1f7fe;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .status-badge.success { background: #e1f7e8; color: #1f7840; }
        .status-badge.failed { background: #ffe8e8; color: #b13e3e; }
        .status-badge.processing { background: #fff3d6; color: #b17f2a; }
        .status-badge.active { background: #e1f7e8; color: #1f7840; }
        .status-badge.inactive { background: #f0f0f0; color: #6f7e95; }
        .role-tag {
            background: #e9effa;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1e4f8a;
            display: inline-block;
        }
        .action-icons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #5f7da0;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.1s;
        }
        .action-btn:hover {
            background: #e9f0fa;
            color: #1f5090;
        }
        .action-btn.qa-icon-only {
            background: transparent;
            color: #2d5e6b;
            padding: 4px 6px;
            font-size: 1rem;
        }
        .action-btn.qa-icon-only:hover {
            background: #e0f0f0;
            color: #1e4752;
        }
        .fail-reason {
            font-size: 0.75rem;
            color: #b13e3e;
            margin-left: 5px;
            white-space: nowrap;
        }
        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #7d95b3;
            background: #f9fcff;
            border-radius: 40px;
        }

        /* ---------- 模态框样式 ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-container {
            background: white;
            width: 780px;
            max-width: 95%;
            border-radius: 48px;
            box-shadow: 0 40px 70px -20px rgba(0,20,40,0.5);
            padding: 32px 32px 36px;
            transform: scale(0.95);
            transition: 0.2s;
        }
        .modal-overlay.active .modal-container {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b2942;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-header h3 i {
            color: #1f5090;
            background: #eaf1fc;
            padding: 12px;
            border-radius: 20px;
        }
        .close-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #8fa3c0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            background: #f0f4fc;
            color: #1f5090;
        }

        /* 文件信息条 */
        .file-info-bar {
            background: #f3f8ff;
            border-radius: 40px;
            padding: 16px 22px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #dae3f0;
        }
        .file-icon {
            font-size: 2rem;
            color: #1f5090;
        }
        .file-details {
            flex: 1;
        }
        .file-name {
            font-weight: 600;
            font-size: 1.2rem;
            color: #0b2942;
        }
        .file-meta {
            font-size: 0.85rem;
            color: #6f89aa;
            margin-top: 4px;
        }

        /* 角色分组标签 */
        .role-group-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2ecfc;
            padding-bottom: 10px;
        }
        .role-group-tab {
            background: transparent;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 500;
            color: #4f688b;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .role-group-tab.active {
            background: #e9f0fa;
            color: #1f5090;
            font-weight: 600;
        }
        .role-group-tab i {
            font-size: 1rem;
        }

        /* 成员列表容器 */
        .member-list-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e2ecfc;
            border-radius: 32px;
            background: #f9fcff;
            margin-bottom: 24px;
        }
        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid #eaf1fb;
        }
        .member-item:last-child {
            border-bottom: none;
        }
        .member-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 3;
        }
        .member-avatar {
            width: 48px;
            height: 48px;
            background: #1f5090;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }
        .member-details {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .member-name {
            font-weight: 600;
            color: #1a2e4a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .member-meta {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            color: #6f89aa;
            margin-top: 4px;
        }
        .member-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .member-meta i {
            font-size: 0.7rem;
        }
        .role-badge {
            background: #e9effa;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1f5090;
            display: inline-block;
        }
        .role-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .role-select {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #b9ceec;
            background: white;
            font-size: 0.9rem;
            color: #1e3a5f;
            outline: none;
            cursor: pointer;
            min-width: 110px;
        }
        .role-select:disabled {
            background: #f0f4fb;
            color: #8fa3c0;
            border-color: #d0dded;
            cursor: not-allowed;
        }
        .lock-badge {
            background: #f0f4fb;
            padding: 6px 16px;
            border-radius: 40px;
            color: #4f688b;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .owner-badge {
            background: #ffecba;
            color: #9e6d0b;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 底部提示 */
        .footnote {
            background: #f0f7ff;
            border-radius: 40px;
            padding: 14px 22px;
            color: #1f5090;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        /* 按钮组 */
        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
        }
        .btn-primary {
            background: #1f5090;
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 16px -6px #1f5090cc;
        }
        .btn-secondary {
            background: white;
            border: 1px solid #c0d0e8;
            color: #1a3455;
            font-weight: 500;
            padding: 15px 32px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            background: #123f6e;
        }
        .btn-secondary:hover {
            background: #f5f9ff;
            border-color: #8fa9cc;
        }
        .empty-group {
            padding: 40px;
            text-align: center;
            color: #8fa3c0;
        }
    </style>
</head>
<body>
<div class="knowledge-base">
    <div class="top-nav">
        <div class="nav-left">
            <h1><i class="fas fa-database"></i> 产品研发知识库</h1>
        </div>
        <div class="nav-right">
            <span><i class="fas fa-sitemap"></i> 公司级 · 产研部</span>
            <span><i class="fas fa-user-circle"></i> 知识库角色: 管理员</span>
        </div>
    </div>

    <div class="main-layout">
        <!-- 左侧目录 -->
        <div class="dir-tree">
            <div class="tree-header">
                <h3><i class="fas fa-folder-tree"></i> 目录</h3>
                <div class="tree-actions">
                    <button id="addRootDirBtn" title="新增根目录"><i class="fas fa-plus"></i></button>
                    <button id="expandAllBtn" title="展开全部"><i class="fas fa-chevron-circle-down"></i></button>
                    <button id="collapseAllBtn" title="折叠全部"><i class="fas fa-chevron-circle-right"></i></button>
                </div>
            </div>
            <div class="tree-list" id="treeContainer"></div>
        </div>

        <!-- 右侧 -->
        <div class="right-panel">
            <div class="filter-bar">
                <div style="display: flex; gap: 12px; align-items: center; flex: 1;">
                    <div class="status-tabs" id="statusTabs">
                        <button class="status-tab active" data-status="all">全部解析状态</button>
                        <button class="status-tab" data-status="success">成功</button>
                        <button class="status-tab" data-status="failed">失败</button>
                        <button class="status-tab" data-status="processing">解析中</button>
                    </div>
                    <div class="file-status-tabs" id="fileStatusTabs">
                        <button class="file-status-tab active" data-filestatus="all">全部文件状态</button>
                        <button class="file-status-tab" data-filestatus="active">正常</button>
                        <button class="file-status-tab" data-filestatus="inactive">已作废</button>
                    </div>
                    <div class="role-filter">
                        <i class="fas fa-user-tag"></i>
                        <select id="roleFilterSelect">
                            <option value="all">我的权限</option>
                            <option value="admin">管理员</option>
                            <option value="editor">编辑者</option>
                            <option value="reader">只读者</option>
                        </select>
                    </div>
                    <button class="upload-btn" id="uploadBtn"><i class="fas fa-cloud-upload-alt"></i> 上传文件</button>
                    <button class="qa-btn" id="qaSearchBtn"><i class="fas fa-robot"></i> 知识问答</button>
                    <div class="date-range">
                        <input type="text" class="date-input" id="startDate" placeholder="开始日期" value="2025-03-01">
                        <span class="date-separator">—</span>
                        <input type="text" class="date-input" id="endDate" placeholder="结束日期" value="2025-03-31">
                    </div>
                    <div class="search-box" style="flex: 1; min-width: 200px;">
                        <i class="fas fa-search"></i>
                        <input type="text" id="fileSearchInput" placeholder="搜索文件名...">
                    </div>
                </div>
            </div>

            <div class="file-list-container" id="fileListContainer"></div>
        </div>
    </div>
</div>

<!-- 成员管理模态框 -->
<div class="modal-overlay" id="memberModal">
    <div class="modal-container">
        <div class="modal-header">
            <h3><i class="fas fa-users-cog"></i> 成员管理</h3>
            <button class="close-btn" id="closeMemberModalBtn"><i class="fas fa-times"></i></button>
        </div>

        <!-- 文件信息 -->
        <div class="file-info-bar">
            <i class="fas fa-file-alt file-icon"></i>
            <div class="file-details">
                <div class="file-name">2025产品路线图.pptx</div>
                <div class="file-meta">上传者：张明 · 4.2 MB · 最后更新：2025-03-14</div>
            </div>
        </div>

        <!-- 角色分组标签 -->
        <div class="role-group-tabs" id="roleGroupTabs">
            <button class="role-group-tab active" data-role="all"><i class="fas fa-users"></i> 全部 (10)</button>
            <button class="role-group-tab" data-role="admin"><i class="fas fa-shield-alt"></i> 管理员 (2)</button>
            <button class="role-group-tab" data-role="editor"><i class="fas fa-pen"></i> 编辑者 (3)</button>
            <button class="role-group-tab" data-role="reader"><i class="fas fa-eye"></i> 只读者 (4)</button>

<!-- 知识库知识问答模态框 -->
<div class="modal-overlay" id="kbQAModal">
    <div class="modal-container">
        <div class="modal-header">
            <h3><i class="fas fa-robot"></i> 知识库知识问答</h3>
            <button class="close-btn" id="closeKbQAModalBtn"><i class="fas fa-times"></i></button>
        </div>

            <p>知识库知识问答功能</p>
        </div>

            <button class="btn-secondary" id="cancelKbQABtn"><i class="fas fa-times"></i> 关闭</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // 知识库角色固定为管理员
        const kbRole = 'admin';

        // 目录树数据
        let treeData = [
            { id: 'd1', name: '产品需求', expanded: true, children: [
                { id: 'd1-1', name: 'PRD文档', expanded: false, children: [] },
                { id: 'd1-2', name: '用户反馈', expanded: false, children: [] }
            ]},
            { id: 'd2', name: '设计稿', expanded: true, children: [
                { id: 'd2-1', name: 'UI源文件', expanded: true, children: [
                    { id: 'd2-1-1', name: '组件库', children: [] }
                ]},
                { id: 'd2-2', name: '交互原型', children: [] }
            ]},
            { id: 'd3', name: '研发文档', expanded: false, children: [
                { id: 'd3-1', name: '架构设计', children: [] },
                { id: 'd3-2', name: 'API规范', children: [] }
            ]},
            { id: 'd4', name: '测试报告', expanded: false, children: [] }
        ];

        function renderTree(nodes, parentElement) {
            nodes.forEach(node => {
                const li = document.createElement('li');
                li.className = 'tree-node';
                li.dataset.id = node.id;

                const div = document.createElement('div');
                div.className = 'node-content';
                div.innerHTML = `
                    <i class="fas ${node.children && node.children.length ? (node.expanded ? 'fa-folder-open' : 'fa-folder') : 'fa-file'}"></i>
                    <span class="name">${node.name}</span>
                    <span class="dir-ops">
                        <button class="dir-add" title="新增子目录"><i class="fas fa-plus"></i></button>
                        <button class="dir-edit" title="重命名"><i class="fas fa-edit"></i></button>
                        <button class="dir-delete" title="删除"><i class="fas fa-trash"></i></button>
                    </span>
                `;
                li.appendChild(div);

                div.querySelector('.dir-add').addEventListener('click', (e) => {
                    e.stopPropagation();
                    alert(`新增子目录到 “${node.name}” (演示)`);
                });
                div.querySelector('.dir-edit').addEventListener('click', (e) => {
                    e.stopPropagation();
                    alert(`重命名目录 “${node.name}” (演示)`);
                });
                div.querySelector('.dir-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`确定删除目录 “${node.name}” ？(演示)`)) alert('已删除');
                });

                if (node.children && node.children.length) {
                    const childUl = document.createElement('ul');
                    childUl.className = 'children';
                    childUl.style.display = node.expanded ? 'block' : 'none';
                    renderTree(node.children, childUl);
                    li.appendChild(childUl);

                    div.addEventListener('click', (e) => {
                        if (e.target.closest('.dir-ops')) return;
                        node.expanded = !node.expanded;
                        childUl.style.display = node.expanded ? 'block' : 'none';
                        const icon = div.querySelector('i:first-child');
                        if (icon) icon.className = `fas ${node.expanded ? 'fa-folder-open' : 'fa-folder'}`;
                    });
                }
                parentElement.appendChild(li);
            });
        }

        const treeContainer = document.getElementById('treeContainer');
        const treeUl = document.createElement('ul');
        treeUl.style.listStyle = 'none';
        treeUl.style.paddingLeft = '4px';
        renderTree(treeData, treeUl);
        treeContainer.appendChild(treeUl);

        document.getElementById('addRootDirBtn').addEventListener('click', () => alert('新增根目录 (演示)'));
        document.getElementById('expandAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.children').forEach(ul => ul.style.display = 'block');
            document.querySelectorAll('.node-content i:first-child').forEach(icon => {
                if (icon.classList.contains('fa-folder')) icon.className = 'fas fa-folder-open';
            });
        });
        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.children').forEach(ul => ul.style.display = 'none');
            document.querySelectorAll('.node-content i:first-child').forEach(icon => {
                if (icon.classList.contains('fa-folder-open')) icon.className = 'fas fa-folder';
            });
        });

        // 文件数据 - 角色只保留 admin/editor/reader
        const allFiles = [
            { name: '2025产品路线图.pptx', size: '4.2 MB', status: 'success', fileStatus: 'active', role: 'admin', creator: '张明', updated: '2025-03-14 14:30', failReason: '' },
            { name: '用户画像分析.xlsx', size: '1.8 MB', status: 'success', fileStatus: 'active', role: 'admin', creator: '李蔚', updated: '2025-03-13 09:20', failReason: '' },
            { name: '交互规范.fig', size: '12 MB', status: 'failed', fileStatus: 'active', role: 'editor', creator: '陈卓', updated: '2025-03-10 11:45', failReason: '文件格式不支持' },
            { name: 'API接口文档.md', size: '0.3 MB', status: 'processing', fileStatus: 'active', role: 'reader', creator: '王景明', updated: '2025-03-15 16:10', failReason: '' },
            { name: '测试报告-迭代7.pdf', size: '3.1 MB', status: 'success', fileStatus: 'inactive', role: 'admin', creator: '张明', updated: '2025-03-12 10:15', failReason: '' },
            { name: '设计评审记录.docx', size: '1.2 MB', status: 'success', fileStatus: 'active', role: 'editor', creator: '张琪', updated: '2025-03-11 13:40', failReason: '' },
            { name: '竞品分析汇总.xlsx', size: '0.9 MB', status: 'success', fileStatus: 'active', role: 'reader', creator: '于海', updated: '2025-03-09 17:20', failReason: '' },
            { name: 'icon资源包.zip', size: '8.5 MB', status: 'failed', fileStatus: 'active', role: 'admin', creator: '李蔚', updated: '2025-03-08 09:30', failReason: '文件损坏' },
            { name: '用户访谈记录.mp3', size: '24 MB', status: 'processing', fileStatus: 'active', role: 'admin', creator: '张明', updated: '2025-03-07 14:50', failReason: '' },
            { name: 'PRD-登录注册.md', size: '0.6 MB', status: 'success', fileStatus: 'active', role: 'admin', creator: '赵一铭', updated: '2025-03-06 11:25', failReason: '' }
        ];

        // 过滤状态
        let currentStatus = 'all';
        let currentFileStatus = 'all';
        let currentRoleFilter = 'all';
        let searchText = '';
        let startDate = '2025-03-01';
        let endDate = '2025-03-31';

        function getVisibleFiles() {
            return allFiles.filter(file => {
                if (kbRole === 'owner') return true;
                if (file.status === 'success') return true;
                if (file.status === 'processing' || file.status === 'failed') {
                    return (file.role === 'admin');
                }
                return true;
            });
        }

        function getFilteredFiles() {
            const visible = getVisibleFiles();
            let filtered = visible.filter(f => {
                if (currentStatus !== 'all' && f.status !== currentStatus) return false;
                if (currentFileStatus !== 'all' && f.fileStatus !== currentFileStatus) return false;
                if (currentRoleFilter !== 'all' && f.role !== currentRoleFilter) return false;
                if (searchText && !f.name.toLowerCase().includes(searchText.toLowerCase())) return false;
                
                // 时间范围过滤
                const fileDate = f.updated.split(' ')[0];
                if (startDate && fileDate < startDate) return false;
                if (endDate && fileDate > endDate) return false;
                
                return true;
            });

            // 按最后编辑时间倒序
            filtered.sort((a, b) => {
                const timeA = new Date(a.updated.replace(' ', 'T')).getTime();
                const timeB = new Date(b.updated.replace(' ', 'T')).getTime();
                return timeB - timeA;
            });
            return filtered;
        }

        function getActionButtons(file) {
            const role = file.role;
            const status = file.status;
            const fileStatus = file.fileStatus;

            if (status === 'processing') {
                return `<span style="color:#a0b8d0;">——</span>`;
            }

            let buttons = [
                `<button class="action-btn" title="查看"><i class="fas fa-eye"></i></button>`,
                `<button class="action-btn" title="下载"><i class="fas fa-download"></i></button>`
            ];

            if (status === 'failed') {
                if (role === 'admin') {
                    buttons.push(`<button class="action-btn" title="删除"><i class="fas fa-trash"></i></button>`);
                    buttons.push(`<button class="action-btn" title="重新解析"><i class="fas fa-sync-alt"></i></button>`);
                }
            }

            if (status === 'success') {
                // 编辑按钮：管理员/编辑者
                if (role === 'admin' || role === 'editor') {
                    buttons.push(`<button class="action-btn" title="编辑"><i class="fas fa-edit"></i></button>`);
                }
                // 删除按钮：仅管理员
                if (role === 'admin') {
                    buttons.push(`<button class="action-btn" title="删除"><i class="fas fa-trash"></i></button>`);
                }
                // 成员管理按钮：所有角色都有
                buttons.push(`<button class="action-btn" title="成员管理"><i class="fas fa-users-cog"></i></button>`);
                
                // 作废/恢复按钮：仅管理员
                if (role === 'admin') {
                    if (fileStatus === 'active') {
                        buttons.push(`<button class="action-btn" title="作废"><i class="fas fa-ban"></i></button>`);
                    } else {
                        buttons.push(`<button class="action-btn" title="恢复"><i class="fas fa-undo-alt"></i></button>`);
                    }
                }

                // 解析成功且状态正常的文件：增加知识问答图标
                if (fileStatus === 'active') {
                    buttons.push(`<button class="action-btn" title="知识问答"><i class="fas fa-robot"></i></button>`);
                }
            }

            return `<div class="action-icons">${buttons.join('')}</div>`;
        }

        function renderFileList() {
            const filtered = getFilteredFiles();
            const container = document.getElementById('fileListContainer');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-message"><i class="fas fa-file fa-3x"></i><br />暂无文件</div>`;
                return;
            }

            let html = `<table class="file-table"><thead><tr>
                <th>文件名</th>
                <th>大小</th>
                <th>解析状态</th>
                <th>文件状态</th>
                <th>我的权限</th>
                <th>创建人</th>
                <th>最后编辑时间</th>
                <th>操作</th>
            </tr></thead><tbody>`;
            
            filtered.forEach(f => {
                let statusIcon = '', statusClass = '', statusText = '';
                if (f.status === 'success') { statusIcon = 'fa-check-circle'; statusClass = 'success'; statusText = '解析成功'; }
                else if (f.status === 'failed') { statusIcon = 'fa-exclamation-circle'; statusClass = 'failed'; statusText = '解析失败'; }
                else { statusIcon = 'fa-sync-alt fa-spin'; statusClass = 'processing'; statusText = '解析中'; }

                const fileStatusText = f.fileStatus === 'active' ? '正常' : '已作废';
                const fileStatusClass = f.fileStatus === 'active' ? 'active' : 'inactive';
                
                // 权限标签只显示管理员/编辑者/只读者
                const roleLabel = { admin:'管理员', editor:'编辑者', reader:'只读者' }[f.role] || f.role;
                const failHtml = (f.status === 'failed' && f.failReason) ? `<span class="fail-reason"><i class="fas fa-info-circle"></i> ${f.failReason}</span>` : '';

                html += `<tr>
                    <td><div class="file-name"><i class="fas fa-file-alt"></i> ${f.name}</div></td>
                    <td>${f.size}</td>
                    <td><span class="status-badge ${statusClass}"><i class="fas ${statusIcon}"></i> ${statusText}</span> ${failHtml}</td>
                    <td><span class="status-badge ${fileStatusClass}"><i class="fas ${f.fileStatus === 'active' ? 'fa-check' : 'fa-ban'}"></i> ${fileStatusText}</span></td>
                    <td><span class="role-tag">${roleLabel}</span></td>
                    <td>${f.creator}</td>
                    <td>${f.updated}</td>
                    <td>${getActionButtons(f)}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        renderFileList();

        // 事件绑定
        document.querySelectorAll('.status-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentStatus = tab.dataset.status;
                renderFileList();
            });
        });

        document.querySelectorAll('.file-status-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.file-status-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFileStatus = tab.dataset.filestatus;
                renderFileList();
            });
        });

        document.getElementById('roleFilterSelect').addEventListener('change', (e) => {
            currentRoleFilter = e.target.value;
            renderFileList();
        });

        document.getElementById('fileSearchInput').addEventListener('input', (e) => {
            searchText = e.target.value;
            renderFileList();
        });

        document.getElementById('startDate').addEventListener('change', (e) => {
            startDate = e.target.value;
            renderFileList();
        });

        document.getElementById('endDate').addEventListener('change', (e) => {
            endDate = e.target.value;
            renderFileList();
        });

        document.getElementById('uploadBtn').addEventListener('click', () => alert('上传文件 (演示)'));

        // 知识问答按钮
        // 模态框元素
        const memberModal = document.getElementById('memberModal');
        const fileQAModal = document.getElementById('fileQAModal');
        const kbQAModal = document.getElementById('kbQAModal');

        // 成员管理模态框
        const closeMemberModalBtn = document.getElementById('closeMemberModalBtn');
        const cancelMemberBtn = document.getElementById('cancelMemberBtn');
        const saveMemberBtn = document.getElementById('saveMemberBtn');

        // 文件知识问答模态框
        const closeFileQAModalBtn = document.getElementById('closeFileQAModalBtn');
        const cancelFileQABtn = document.getElementById('cancelFileQABtn');

        // 知识库知识问答模态框
        const closeKbQAModalBtn = document.getElementById('closeKbQAModalBtn');
        const cancelKbQABtn = document.getElementById('cancelKbQABtn');

        // 关闭模态框函数
        function closeModal(modal) {
            modal.classList.remove('active');
        }

        // 成员管理模态框事件
        closeMemberModalBtn.addEventListener('click', () => closeModal(memberModal));
        cancelMemberBtn.addEventListener('click', () => closeModal(memberModal));
        memberModal.addEventListener('click', (e) => {
            if (e.target === memberModal) closeModal(memberModal);
        });

        // 文件知识问答模态框事件
        closeFileQAModalBtn.addEventListener('click', () => closeModal(fileQAModal));
        cancelFileQABtn.addEventListener('click', () => closeModal(fileQAModal));
        fileQAModal.addEventListener('click', (e) => {
            if (e.target === fileQAModal) closeModal(fileQAModal);
        });

        // 知识库知识问答模态框事件
        closeKbQAModalBtn.addEventListener('click', () => closeModal(kbQAModal));
        cancelKbQABtn.addEventListener('click', () => closeModal(kbQAModal));
        kbQAModal.addEventListener('click', (e) => {
            if (e.target === kbQAModal) closeModal(kbQAModal);
        });

        // 保存成员管理设置
        saveMemberBtn.addEventListener('click', () => {
            alert('✅ 文件成员权限已保存');
            closeModal(memberModal);
        });

        // 操作按钮演示
        document.getElementById('fileListContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.action-btn');
            if (!btn) return;
            e.preventDefault();
            const action = btn.querySelector('i')?.className || '';
            if (action.includes('fa-eye')) window.location.href = '6文件详情.html';
            else if (action.includes('fa-download')) alert('下载文件 (演示)');
            else if (action.includes('fa-trash')) alert('删除文件 (演示)');
            else if (action.includes('fa-sync-alt')) alert('重新解析 (演示)');
            else if (action.includes('fa-edit')) alert('编辑文件 (演示)');
            else if (action.includes('fa-users-cog')) memberModal.classList.add('active');
            else if (action.includes('fa-ban')) alert('作废文件 (演示)');
            else if (action.includes('fa-undo-alt')) alert('恢复文件 (演示)');
            else if (action.includes('fa-robot')) window.location.href = '文件知识问答.html';
        });

        // 知识问答按钮
        document.getElementById('qaSearchBtn').addEventListener('click', () => {
            window.location.href = '知识库知识问答.html';
        });

        // 成员管理模态框功能
        const roleGroupTabs = document.getElementById('roleGroupTabs');
        const memberListContainer = document.getElementById('memberListContainer');

        // 模拟成员数据
        const members = [
            { id: 1, name: '张明', dept: '产研部', position: '部门经理', phone: '13800138001', account: 'zhangming', kbRole: 'admin', role: 'admin', isOwner: true, isUploader: true },
            { id: 2, name: '李蔚', dept: '产研部', position: '产品经理', phone: '13800138002', account: 'liwei', kbRole: 'admin', role: 'admin', isOwner: false, isUploader: true },
            { id: 3, name: '陈卓', dept: '设计部', position: 'UI设计师', phone: '13800138003', account: 'chenzhuo', kbRole: 'editor', role: 'editor', isOwner: false, isUploader: false },
            { id: 4, name: '王景明', dept: '研发部', position: '前端开发', phone: '13800138004', account: 'wangjingming', kbRole: 'editor', role: 'editor', isOwner: false, isUploader: false },
            { id: 5, name: '张琪', dept: '设计部', position: 'UX设计师', phone: '13800138005', account: 'zhangqi', kbRole: 'editor', role: 'editor', isOwner: false, isUploader: false },
            { id: 6, name: '于海', dept: '产品部', position: '产品助理', phone: '13800138006', account: 'yuhai', kbRole: 'reader', role: 'reader', isOwner: false, isUploader: false },
            { id: 7, name: '赵一铭', dept: '产品部', position: '产品专员', phone: '13800138007', account: 'zhaoyiming', kbRole: 'reader', role: 'reader', isOwner: false, isUploader: false },
            { id: 8, name: '刘芳', dept: '市场部', position: '市场专员', phone: '13800138008', account: 'liufang', kbRole: 'reader', role: 'reader', isOwner: false, isUploader: false },
            { id: 9, name: '孙伟', dept: '销售部', position: '销售经理', phone: '13800138009', account: 'sunwei', kbRole: 'reader', role: 'reader', isOwner: false, isUploader: false },
            { id: 10, name: '周强', dept: '财务部', position: '财务专员', phone: '13800138010', account: 'zhouqiang', kbRole: 'none', role: 'none', isOwner: false, isUploader: false }
        ];

        // 角色选项
        const roleOptions = [
            { value: 'admin', label: '管理员' },
            { value: 'editor', label: '编辑者' },
            { value: 'reader', label: '只读者' },
            { value: 'none', label: '无权限' }
        ];

        // 渲染成员列表
        function renderMemberList(role = 'all') {
            let filteredMembers = members;
            if (role !== 'all') {
                filteredMembers = members.filter(member => member.role === role);
            }

            if (filteredMembers.length === 0) {
                memberListContainer.innerHTML = '<div class="empty-group">该角色组暂无成员</div>';
                return;
            }

            let html = '';
            filteredMembers.forEach(member => {
                const isLocked = member.isOwner || member.isUploader;
                const roleLabel = roleOptions.find(opt => opt.value === member.role)?.label || member.role;
                const kbRoleLabel = roleOptions.find(opt => opt.value === member.kbRole)?.label || member.kbRole;

                html += `
                    <div class="member-item">
                        <div class="member-info">
                            <div class="member-avatar">${member.name.charAt(0)}</div>
                            <div class="member-details">
                                <div class="member-name">
                                    ${member.name}
                                    ${member.isOwner ? '<span class="owner-badge"><i class="fas fa-crown"></i> 所有者</span>' : ''}
                                    ${member.isUploader && !member.isOwner ? '<span class="lock-badge"><i class="fas fa-lock"></i> 上传者</span>' : ''}
                                </div>
                                <div class="member-meta">
                                    <span><i class="fas fa-building"></i> ${member.dept}</span>
                                    <span><i class="fas fa-briefcase"></i> ${member.position}</span>
                                    <span><i class="fas fa-phone"></i> ${member.phone}</span>
                                    <span><i class="fas fa-user"></i> ${member.account}</span>
                                    <span><i class="fas fa-sitemap"></i> <span class="role-badge">${kbRoleLabel}</span></span>
                                </div>
                            </div>
                        </div>
                        <div class="role-control">
                            ${isLocked ? 
                                `<span class="role-badge">${roleLabel} <i class="fas fa-lock" style="margin-left: 4px;"></i></span>` : 
                                `<select class="role-select" data-member-id="${member.id}">
                                    ${roleOptions.map(opt => `
                                        <option value="${opt.value}" ${member.role === opt.value ? 'selected' : ''}>
                                            ${opt.label}
                                        </option>
                                    `).join('')}
                                </select>`
                            }
                        </div>
                    </div>
                `;
            });

            memberListContainer.innerHTML = html;

            // 绑定角色选择事件
            document.querySelectorAll('.role-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const memberId = parseInt(e.target.dataset.memberId);
                    const newRole = e.target.value;
                    const member = members.find(m => m.id === memberId);
                    if (member) {
                        member.role = newRole;
                    }
                });
            });
        }

        // 角色分组标签点击事件
        roleGroupTabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.role-group-tab');
            if (!tab) return;

            // 更新标签状态
            document.querySelectorAll('.role-group-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            // 渲染对应角色的成员列表
            const role = tab.dataset.role;
            renderMemberList(role);
        });

        // 打开成员管理模态框时渲染成员列表
        document.getElementById('fileListContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.action-btn');
            if (!btn) return;
            const action = btn.querySelector('i')?.className || '';
            if (action.includes('fa-users-cog')) {
                // 延迟渲染，确保模态框已显示
                setTimeout(() => {
                    renderMemberList('all');
                }, 100);
            }
        });
    })();
</script>
</body>
</html>
