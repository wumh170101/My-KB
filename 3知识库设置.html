<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库设置 · 成员含部门岗位</title>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #e2eaf3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .settings-card {
            width: 960px;
            max-width: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            box-shadow: 0 30px 60px -15px rgba(0,20,40,0.3), 0 0 0 1px rgba(0,30,60,0.08);
            overflow: hidden;
        }
        .card-header {
            padding: 28px 32px 12px 32px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .card-header h2 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0a253b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h2 i {
            color: #1f5090;
        }
        .tabs {
            display: flex;
            padding: 0 32px;
            gap: 30px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .tab-btn {
            background: transparent;
            border: 0;
            padding: 16px 0 12px 0;
            font-size: 1.1rem;
            font-weight: 500;
            color: #5e6f88;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn i {
            font-size: 1.2rem;
            opacity: 0.7;
        }
        .tab-btn.active {
            color: #123f6e;
            border-bottom-color: #1f5090;
            font-weight: 600;
        }
        .tab-btn.active i {
            opacity: 1;
            color: #1f5090;
        }
        .tab-content {
            padding: 28px 32px 36px 32px;
            background: rgba(255,255,255,0.5);
            min-height: 500px;
        }
        .pane {
            display: none;
            animation: fade 0.2s;
        }
        .pane.active {
            display: block;
        }
        @keyframes fade { from {opacity:0.2;} to {opacity:1;} }

        /* 基础信息表单 */
        .field-row {
            margin-bottom: 24px;
        }
        .field-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #25476b;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .field-input, .field-select {
            width: 100%;
            padding: 14px 18px;
            background: white;
            border: 1px solid #dae2ed;
            border-radius: 20px;
            font-size: 1rem;
        }
        .field-select {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23365e8a" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 18px center;
        }
        .hint {
            font-size: 0.8rem;
            color: #6b7f9c;
            margin-top: 6px;
        }
        .dept-tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 12px 0;
        }
        .dept-tag {
            background: #e5effa;
            color: #1f5090;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #b2cbeb;
        }
        .dept-selector {
            background: #f3f8ff;
            border-radius: 40px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px dashed #9eb9db;
        }

        /* ----- 成员管理 横向角色标签 (与之前一致) ----- */
        .role-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #dae2ed;
            padding-bottom: 8px;
        }
        .role-tag {
            background: transparent;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 40px 40px 0 0;
            color: #4d627c;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .role-tag i {
            font-size: 1rem;
        }
        .role-tag.active {
            background: white;
            color: #1f5090;
            font-weight: 600;
            border: 1px solid #d0dded;
            border-bottom-color: white;
        }
        .member-list {
            background: #f9fcff;
            border-radius: 28px;
            padding: 10px 0;
            border: 1px solid #e5eefc;
        }
        .member-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid #eaf1fb;
        }
        .member-row:last-child {
            border-bottom: none;
        }
        .member-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 3;
        }
        .member-avatar {
            width: 50px;
            height: 50px;
            background: #1f5090;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.3rem;
        }
        /* 关键修改：部门+岗位与姓名账号电话并列 */
        .details-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px 36px;
            align-items: center;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            min-width: 130px;
        }
        .detail-label {
            font-size: 0.7rem;
            color: #7f94b0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .detail-value {
            font-weight: 500;
            color: #1a2e4a;
            font-size: 0.95rem;
            margin-top: 4px;
            word-break: break-word;
        }
        .role-control {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 200px;
            justify-content: flex-end;
        }
        .role-badge-current {
            background: #eaf0fa;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #1f5090;
            font-weight: 500;
            min-width: 80px;
            text-align: center;
        }
        .role-select {
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #b9ceec;
            background: white;
            font-size: 0.85rem;
            color: #1e3a5f;
            cursor: pointer;
        }
        .owner-disabled {
            background: #f0f4fb;
            padding: 6px 16px;
            border-radius: 30px;
            color: #506e96;
            font-size: 0.9rem;
        }

        /* 高级设置 */
        .danger-zone {
            background: #fff6f0;
            border-radius: 28px;
            padding: 30px;
            border: 1px solid #ffcdb0;
            text-align: center;
        }
        .btn-delete {
            background: #d54c3a;
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 36px;
            border-radius: 60px;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .footer-note {
            padding: 16px 32px 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .button-group {
            display: flex;
            gap: 16px;
        }
        .btn-primary {
            background: #1f5090;
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary {
            background: white;
            border: 1px solid #c0d0e8;
            color: #1a3455;
            padding: 13px 28px;
            border-radius: 40px;
            cursor: pointer;
        }
        .export-btn {
            background: #2d5e6b;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
<div class="settings-card" id="settingsCard">
    <div class="card-header">
        <h2><i class="fas fa-cubes"></i> 产品知识库 · 设置</h2>
    </div>

    <div class="tabs" id="tabHeaders">
        <button class="tab-btn active" data-tab="basic"><i class="fas fa-info-circle"></i> 基础信息</button>
        <button class="tab-btn" data-tab="members"><i class="fas fa-users"></i> 成员管理</button>
        <button class="tab-btn" data-tab="advanced"><i class="fas fa-cog"></i> 高级设置</button>
    </div>

    <div class="tab-content" id="tabContent">
        <!-- 基础信息 pane (不变) -->
        <div class="pane active" id="pane-basic">
            <div class="field-row">
                <div class="field-label"><i class="fas fa-tag"></i> 知识库名称</div>
                <input class="field-input" value="产品研发中心知识库">
            </div>
            <div class="field-row">
                <div class="field-label"><i class="fas fa-align-left"></i> 简介</div>
                <input class="field-input" value="产研团队文档、规范、设计稿">
            </div>
            <div class="field-row">
                <div class="field-label"><i class="fas fa-sitemap"></i> 类型</div>
                <select class="field-select" id="knowledgeTypeSelect">
                    <option value="personal">个人级</option>
                    <option value="company" selected>公司级</option>
                </select>
            </div>
            <div class="field-row" id="deptSection">
                <div class="field-label"><i class="fas fa-building"></i> 关联部门</div>
                <div class="dept-tag-group">
                    <span class="dept-tag">产品部 <i class="fas fa-times-circle"></i></span>
                    <span class="dept-tag">设计部 <i class="fas fa-times-circle"></i></span>
                    <span class="dept-tag">研发部 <i class="fas fa-times-circle"></i></span>
                </div>
                <div class="dept-selector"><i class="fas fa-plus-circle"></i> 添加部门</div>
                <div class="hint">有文件时仅可增加部门，不可移除</div>
            </div>
        </div>

        <!-- 成员管理 pane (部门+岗位已加入) -->
        <div class="pane" id="pane-members">
            <div class="role-tabs" id="roleTabs">
                <button class="role-tag active" data-role="owner"><i class="fas fa-crown"></i> 所有者</button>
                <button class="role-tag" data-role="admin"><i class="fas fa-shield-alt"></i> 管理员</button>
                <button class="role-tag" data-role="editor"><i class="fas fa-pen"></i> 编辑者</button>
                <button class="role-tag" data-role="reader"><i class="fas fa-eye"></i> 只读者</button>
            </div>
            <div class="member-list" id="memberListContainer"></div>
            <div style="background:#eef4fe; border-radius:60px; padding:14px 20px; margin-top:20px; color:#1f5090;">
                <i class="fas fa-sync-alt"></i> 成员由关联部门同步，可调整角色（所有者不可修改）
            </div>
        </div>

        <!-- 高级设置 pane (仅删除) -->
        <div class="pane" id="pane-advanced">
            <div class="danger-zone">
                <h3><i class="fas fa-exclamation-triangle"></i> 危险操作区</h3>
                <button class="btn-delete" id="deleteKnowledgeBaseBtn"><i class="fas fa-trash-alt"></i> 删除知识库</button>
                <p style="margin-top:24px; color:#a45d4b;">删除后所有文件永久移除，不可恢复</p>
            </div>
        </div>
    </div>

    <div class="footer-note" id="footerAction">
        <div class="button-group">
            <button class="btn-primary" id="saveSettingsBtn"><i class="fas fa-save"></i> 保存设置</button>
            <button class="btn-secondary" id="cancelBtn"><i class="fas fa-times"></i> 取消</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // 一级tab
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panes = {
            basic: document.getElementById('pane-basic'),
            members: document.getElementById('pane-members'),
            advanced: document.getElementById('pane-advanced')
        };
        function activateMainTab(tabId) {
            tabBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabId));
            Object.keys(panes).forEach(id => panes[id].classList.toggle('active', id === tabId));
        }
        tabBtns.forEach(btn => btn.addEventListener('click', () => activateMainTab(btn.dataset.tab)));

        // 基础信息：部门显示控制
        const typeSelect = document.getElementById('knowledgeTypeSelect');
        const deptSection = document.getElementById('deptSection');
        typeSelect.addEventListener('change', () => {
            deptSection.style.display = typeSelect.value === 'company' ? 'block' : 'none';
        });
        deptSection.style.display = 'block'; // 初始公司级

        // ---------- 成员模拟数据：扩充部门+岗位 ----------
        const membersData = {
            owner: [
                { name: '王景明', account: 'wangjm@company.com', phone: '138-0001-1234', dept: '产品部', title: '产品总监', role: 'owner' }
            ],
            admin: [
                { name: '李蔚', account: 'liwei@company.com', phone: '138-0002-5678', dept: '产品部', title: '产品经理', role: 'admin' },
                { name: '陈卓', account: 'chenzhuo@company.com', phone: '138-0003-9012', dept: '设计部', title: '交互设计主管', role: 'admin' }
            ],
            editor: [
                { name: '张琪', account: 'zhangqi@company.com', phone: '138-0004-3456', dept: '设计部', title: '视觉设计师', role: 'editor' },
                { name: '何冰', account: 'hebing@company.com', phone: '138-0005-7890', dept: '研发部', title: '前端开发', role: 'editor' },
                { name: '赵一铭', account: 'zhaoym@company.com', phone: '138-0006-2345', dept: '研发部', title: '后端开发', role: 'editor' }
            ],
            reader: [
                { name: '于海', account: 'yuhai@company.com', phone: '138-0007-6789', dept: '产品部', title: '产品运营', role: 'reader' },
                { name: '孟晓', account: 'mengxiao@company.com', phone: '138-0008-0123', dept: '市场部', title: '市场助理', role: 'reader' },
                { name: '周婷', account: 'zhouting@company.com', phone: '138-0009-4567', dept: '设计部', title: 'UI实习生', role: 'reader' },
                { name: '郑源', account: 'zhengyuan@company.com', phone: '138-0010-8901', dept: '研发部', title: '测试工程师', role: 'reader' }
            ]
        };

        const roleTags = document.querySelectorAll('.role-tag');
        const memberContainer = document.getElementById('memberListContainer');

        function renderMembers(role) {
            const members = membersData[role] || [];
            let html = '';
            members.forEach(m => {
                const isOwner = (role === 'owner');
                // 角色下拉选项
                const roleOptions = ['admin', 'editor', 'reader'];
                const roleLabels = { admin: '管理员', editor: '编辑者', reader: '只读者' };
                let selectHtml = '';
                if (!isOwner) {
                    selectHtml = `
                        <select class="role-select" data-account="${m.account}" data-original-role="${m.role}">
                            ${roleOptions.map(r => `<option value="${r}" ${m.role === r ? 'selected' : ''}>${roleLabels[r]}</option>`).join('')}
                        </select>
                    `;
                } else {
                    selectHtml = `<span class="owner-disabled"><i class="fas fa-lock"></i> 所有者</span>`;
                }

                // 关键：部门+岗位字段渲染
                html += `
                    <div class="member-row">
                        <div class="member-info">
                            <div class="member-avatar">${m.name[0]}</div>
                            <div class="details-grid">
                                <div class="detail-item"><span class="detail-label">姓名</span><span class="detail-value">${m.name}</span></div>
                                <div class="detail-item"><span class="detail-label">账号</span><span class="detail-value">${m.account}</span></div>
                                <div class="detail-item"><span class="detail-label">电话</span><span class="detail-value">${m.phone}</span></div>
                                <div class="detail-item"><span class="detail-label">部门</span><span class="detail-value">${m.dept || '—'}</span></div>
                                <div class="detail-item"><span class="detail-label">岗位</span><span class="detail-value">${m.title || '—'}</span></div>
                            </div>
                        </div>
                        <div class="role-control">
                            ${!isOwner ? `<span class="role-badge-current">${roleLabels[m.role] || ''}</span>` : ''}
                            ${selectHtml}
                        </div>
                    </div>
                `;
            });
            memberContainer.innerHTML = html;

            // 绑定调整角色事件
            document.querySelectorAll('.role-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const newRole = e.target.value;
                    const account = e.target.dataset.account;
                    alert(`演示：已将 ${account} 的角色调整为 ${roleLabels[newRole]}\n(保存后生效)`);
                });
            });
        }

        // 初始显示所有者
        renderMembers('owner');

        // 角色标签点击
        roleTags.forEach(tag => {
            tag.addEventListener('click', () => {
                roleTags.forEach(t => t.classList.remove('active'));
                tag.classList.add('active');
                renderMembers(tag.dataset.role);
            });
        });

        // 底部按钮演示
        document.getElementById('saveSettingsBtn').addEventListener('click', () => alert('设置已保存（演示）'));
        document.getElementById('cancelBtn').addEventListener('click', () => alert('取消编辑'));
        document.getElementById('deleteKnowledgeBaseBtn')?.addEventListener('click', () => {
            if (confirm('永久删除知识库？不可恢复。')) alert('已删除（演示）');
        });



        // 部门点击演示
        document.querySelectorAll('.dept-tag i').forEach(icon => {
            icon.addEventListener('click', (e) => {
                e.stopPropagation();
                alert('有文件时不可移除部门');
            });
        });
        document.querySelector('.dept-selector')?.addEventListener('click', () => alert('打开部门选择器'));
    })();
</script>
</body>
</html>
