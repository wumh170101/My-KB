<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识问答 · 财务知识库</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #eef2f6;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
        }
        
        .knowledge-page {
            width: 1400px;
            max-width: 100%;
        }
        
        /* 头部导航 - 类似页签形式 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            background: white;
            border-radius: 60px;
            padding: 12px 28px;
            box-shadow: 0 8px 20px -8px rgba(0,20,40,0.1);
            border: 1px solid #e0eaf5;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0a253b;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i {
            color: #1f5090;
            background: #e1ebf9;
            padding: 10px;
            border-radius: 20px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            background: #f3f8ff;
            padding: 4px;
            border-radius: 40px;
        }
        .nav-tab {
            background: transparent;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            color: #4f688b;
            cursor: pointer;
            font-size: 1rem;
        }
        .nav-tab.active {
            background: white;
            color: #1f5090;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1f3a5f;
            font-weight: 500;
        }
        
        /* 主内容区 - 知识问答页签内容 */
        .main-content {
            background: white;
            border-radius: 48px;
            padding: 36px 40px;
            box-shadow: 0 20px 40px -12px rgba(0,20,40,0.2);
            border: 1px solid #e2ecfc;
        }
        
        /* 知识库信息 */
        .kb-info {
            background: #f3f8ff;
            border-radius: 30px;
            padding: 20px 28px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #dae3f0;
        }
        .kb-icon {
            background: #2d5e6b;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }
        .kb-details {
            flex: 1;
        }
        .kb-name {
            font-weight: 600;
            font-size: 1.3rem;
            color: #0b2942;
            margin-bottom: 6px;
        }
        .kb-meta {
            font-size: 0.9rem;
            color: #6f89aa;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        /* 搜索区域 */
        .search-area {
            margin-bottom: 30px;
        }
        .question-input {
            width: 100%;
            padding: 20px 24px;
            background: #f9fcff;
            border: 1px solid #dae2ed;
            border-radius: 30px;
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 20px;
            transition: 0.1s;
        }
        .question-input:focus {
            border-color: #2d5e6b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45,94,107,0.15);
            background: white;
        }
        .action-buttons {
            display: flex;
            justify-content: flex-end;
        }
        .generate-btn {
            background: #2d5e6b;
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 40px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 16px -6px #2d5e6bcc;
            transition: 0.1s;
        }
        .generate-btn:hover {
            background: #1e4752;
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 答案区域 */
        .answer-section {
            background: #f9fcff;
            border-radius: 32px;
            padding: 30px;
            border: 1px solid #e2ecfc;
            margin-top: 20px;
        }
        .answer-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .answer-header i {
            font-size: 1.8rem;
            color: #2d5e6b;
            background: #e4f0f2;
            padding: 12px;
            border-radius: 20px;
        }
        .answer-header h4 {
            font-size: 1.3rem;
            color: #0b2942;
        }
        .answer-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 30px;
            line-height: 1.7;
            color: #1a2e4a;
            border: 1px solid #e2ecfc;
        }
        
        /* 文档列表（包含召回片段） */
        .document-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .document-card {
            background: white;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid #e2ecfc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: 0.1s;
        }
        .document-card:hover {
            border-color: #2d5e6b;
            box-shadow: 0 8px 20px rgba(45,94,107,0.1);
        }
        .doc-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
        }
        .doc-icon {
            font-size: 2.2rem;
            color: #2d5e6b;
            background: #e4f0f2;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doc-title {
            flex: 1;
        }
        .doc-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #0b2942;
            margin-bottom: 6px;
        }
        .doc-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.85rem;
            color: #6f89aa;
        }
        .doc-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .doc-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .tag {
            background: #f0f7ff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag.kb {
            background: #e4f0f2;
            color: #1e4752;
        }
        .tag.permission {
            background: #e9effa;
            color: #1f5090;
        }
        .fragment-section {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px dashed #dae3f0;
        }
        .fragment-title {
            font-size: 0.95rem;
            color: #1f5090;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .fragment-item {
            background: #f9fcff;
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 12px;
            border-left: 4px solid #2d5e6b;
        }
        .fragment-item:last-child {
            margin-bottom: 0;
        }
        .fragment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .fragment-score {
            background: #e4f0f2;
            padding: 4px 12px;
            border-radius: 30px;
            color: #1e4752;
            font-weight: 500;
        }
        .fragment-text {
            color: #1a2e4a;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .doc-link {
            color: #2d5e6b;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 18px;
            border-radius: 30px;
            background: #e4f0f2;
            font-size: 0.9rem;
            margin-top: 16px;
        }
        .doc-link:hover {
            background: #d0e4e8;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            padding: 40px;
            text-align: center;
            color: #8fa3c0;
            background: white;
            border-radius: 28px;
        }
    </style>
</head>
<body>
    <div class="knowledge-page">
        <!-- 头部导航 - 类似页签形式 -->
        <div class="header">
            <h1><i class="fas fa-database"></i> 知识库</h1>
            <div class="nav-tabs">
                <button class="nav-tab">文档列表</button>
                <button class="nav-tab active">知识问答</button>
                <button class="nav-tab">成员管理</button>
                <button class="nav-tab">设置</button>
            </div>
            <div class="user-info">
                <i class="fas fa-user-circle" style="font-size: 1.5rem; color: #1f5090;"></i>
                <span>张明 · 财务部</span>
            </div>
        </div>
        
        <!-- 主内容区 - 知识问答页签内容 -->
        <div class="main-content">
            <!-- 知识库信息 - 改为财务知识库 -->
            <div class="kb-info">
                <div class="kb-icon"><i class="fas fa-calculator"></i></div>
                <div class="kb-details">
                    <div class="kb-name">财务知识库</div>
                    <div class="kb-meta">
                        <span><i class="fas fa-sitemap"></i> 公司级 · 财务部</span>
                        <span><i class="fas fa-file-alt"></i> 156 个文件</span>
                        <span><i class="fas fa-clock"></i> 最后更新 2025-03-18</span>
                    </div>
                </div>
            </div>

            <!-- 搜索区 -->
            <div class="search-area">
                <textarea class="question-input" id="questionInput" placeholder="请输入您的问题...例如：2025年北京差旅费报销标准是多少">2025年北京差旅费报销标准是多少</textarea>
                <div class="action-buttons">
                    <button class="generate-btn" id="generateBtn">
                        <i class="fas fa-magic"></i> 大模型生成
                    </button>
                </div>
            </div>

            <!-- 答案区 (初始隐藏) -->
            <div class="answer-section" id="answerSection" style="display: none;">
                <div class="answer-header">
                    <i class="fas fa-lightbulb"></i>
                    <h4>生成答案</h4>
                </div>
                
                <!-- 答案内容 -->
                <div class="answer-content" id="answerContent">
                    根据《2025年差旅费管理办法》和《北京地区差旅费报销细则》，2025年北京差旅费报销标准如下：住宿费上限650元/天，伙食补助100元/天，交通补助80元/天。具体标准根据职级和季节有所浮动。
                </div>

                <!-- 合并后的文档列表（包含召回片段） -->
                <div class="document-list" id="documentList">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const generateBtn = document.getElementById('generateBtn');
            const questionInput = document.getElementById('questionInput');
            const answerSection = document.getElementById('answerSection');
            const answerContent = document.getElementById('answerContent');
            const documentList = document.getElementById('documentList');
            
            // 大模型生成按钮点击
            generateBtn.addEventListener('click', () => {
                const question = questionInput.value.trim();
                if (!question) {
                    alert('请输入问题');
                    return;
                }
                
                // 模拟加载状态
                generateBtn.disabled = true;
                generateBtn.innerHTML = '<span class="loading-spinner"></span> 生成中...';
                
                // 模拟API调用延迟
                setTimeout(() => {
                    // 根据问题内容动态生成不同的答案和文档（演示用）
                    let answer = '';
                    let documents = [];
                    
                    if (question.includes('差旅费') || question.includes('报销标准') || question.includes('北京')) {
                        answer = '根据《2025年差旅费管理办法》和《北京地区差旅费报销细则》，2025年北京差旅费报销标准如下：\n\n• 住宿费：一般员工500元/天，经理级650元/天，总监级800元/天（旺季7-9月上浮20%）\n• 伙食补助：100元/天\n• 交通补助：80元/天\n• 出差补贴：北京六环内不享受住宿补贴，六环外按标准执行\n\n注：以上标准自2025年1月1日起执行，原标准同时废止。';
                        documents = [
                            {
                                name: '2025年差旅费管理办法.pdf',
                                icon: 'fa-file-pdf',
                                creator: '财务部',
                                size: '2.8 MB',
                                date: '2024-12-20',
                                kb: '财务知识库',
                                permission: '只读者',
                                fragments: [
                                    { score: '0.98', text: '“第五章 差旅费标准：第二十一条 北京地区住宿费标准为：一般员工500元/天，经理级650元/天，总监级800元/天。每年7-9月为旺季，标准上浮20%。”' },
                                    { score: '0.95', text: '“第二十三条 伙食补助费按自然天数计算，每人每天100元，不再另外报销餐饮发票。”' }
                                ]
                            },
                            {
                                name: '北京地区差旅费报销细则.docx',
                                icon: 'fa-file-word',
                                creator: '财务部',
                                size: '1.5 MB',
                                date: '2024-12-25',
                                kb: '财务知识库',
                                permission: '管理员',
                                fragments: [
                                    { score: '0.96', text: '“3.2 北京六环内差旅：因公前往北京六环内区域，如无法提供住宿发票，按实际住宿天数给予住宿补贴的50%。”' },
                                    { score: '0.92', text: '“3.5 交通补助：市内交通按每人每天80元包干，不再报销出租车票。往返机场/火车站可凭票据实报实销。”' }
                                ]
                            },
                            {
                                name: '2025年差旅政策解读.pptx',
                                icon: 'fa-file-powerpoint',
                                creator: '财务部',
                                size: '3.2 MB',
                                date: '2025-01-05',
                                kb: '财务知识库',
                                permission: '编辑者',
                                fragments: [
                                    { score: '0.89', text: '“北京地区差旅标准变化：对比2024年，住宿费上调10%，伙食补助不变，新增旺季浮动机制。”' }
                                ]
                            }
                        ];
                    } else if (question.includes('住宿') || question.includes('酒店')) {
                        answer = '2025年北京地区住宿费标准为：一般员工500元/天，经理级650元/天，总监级800元/天。7-9月旺季期间标准上浮20%。';
                        documents = [
                            {
                                name: '2025年差旅费管理办法.pdf',
                                icon: 'fa-file-pdf',
                                creator: '财务部',
                                size: '2.8 MB',
                                date: '2024-12-20',
                                kb: '财务知识库',
                                permission: '只读者',
                                fragments: [
                                    { score: '0.98', text: '“第二十一条 北京地区住宿费标准为：一般员工500元/天，经理级650元/天，总监级800元/天。每年7-9月为旺季，标准上浮20%。”' }
                                ]
                            }
                        ];
                    } else if (question.includes('餐补') || question.includes('伙食')) {
                        answer = '2025年差旅伙食补助标准为每人每天100元，按自然天数计算，不再另外报销餐饮发票。';
                        documents = [
                            {
                                name: '2025年差旅费管理办法.pdf',
                                icon: 'fa-file-pdf',
                                creator: '财务部',
                                size: '2.8 MB',
                                date: '2024-12-20',
                                kb: '财务知识库',
                                permission: '只读者',
                                fragments: [
                                    { score: '0.97', text: '“第二十三条 伙食补助费按自然天数计算，每人每天100元，不再另外报销餐饮发票。”' }
                                ]
                            }
                        ];
                    } else {
                        answer = '抱歉，未能找到与您问题相关的文档。请尝试换个问法，或检查财务知识库中是否包含相关内容。';
                        documents = [];
                    }
                    
                    // 更新答案区
                    answerContent.innerText = answer;
                    
                    // 渲染文档列表（包含召回片段）
                    if (documents.length > 0) {
                        let docHtml = '';
                        documents.forEach(doc => {
                            // 构建片段HTML
                            let fragmentsHtml = '';
                            doc.fragments.forEach(f => {
                                fragmentsHtml += `
                                    <div class="fragment-item">
                                        <div class="fragment-header">
                                            <span class="fragment-source">召回片段</span>
                                            <span class="fragment-score">相似度 ${f.score}</span>
                                        </div>
                                        <div class="fragment-text">${f.text}</div>
                                    </div>
                                `;
                            });
                            
                            docHtml += `
                                <div class="document-card">
                                    <div class="doc-header">
                                        <div class="doc-icon"><i class="fas ${doc.icon}"></i></div>
                                        <div class="doc-title">
                                            <div class="doc-name">${doc.name}</div>
                                            <div class="doc-meta">
                                                <span><i class="fas fa-user"></i> ${doc.creator}</span>
                                                <span><i class="fas fa-file"></i> ${doc.size}</span>
                                                <span><i class="fas fa-calendar"></i> ${doc.date}</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="doc-tags">
                                        <span class="tag kb"><i class="fas fa-database"></i> ${doc.kb}</span>
                                        <span class="tag permission"><i class="fas fa-user-tag"></i> ${doc.permission}</span>
                                    </div>
                                    
                                    <div class="fragment-section">
                                        <div class="fragment-title"><i class="fas fa-file-alt"></i> 召回片段</div>
                                        ${fragmentsHtml}
                                    </div>
                                    
                                    <a href="#" class="doc-link" onclick="alert('查看文档：${doc.name} (演示)')">
                                        <i class="fas fa-external-link-alt"></i> 查看完整文档
                                    </a>
                                </div>
                            `;
                        });
                        documentList.innerHTML = docHtml;
                    } else {
                        documentList.innerHTML = '<div class="empty-state"><i class="fas fa-file-alt fa-2x" style="opacity:0.3; margin-bottom:10px;"></i><br />暂无相关文档</div>';
                    }
                    
                    // 显示答案区
                    answerSection.style.display = 'block';
                    
                    // 恢复按钮状态
                    generateBtn.disabled = false;
                    generateBtn.innerHTML = '<i class="fas fa-magic"></i> 大模型生成';
                    
                }, 1500); // 模拟1.5秒延迟
            });
            
            // 拦截文档链接的默认跳转，使用alert演示
            document.addEventListener('click', (e) => {
                if (e.target.closest('.doc-link')) {
                    e.preventDefault();
                    // 已经在onclick中处理了alert
                }
            });
        })();
    </script>
</body>
</html>
